<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lista de Tarefas</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { text-align: center; }
    form { display: flex; gap: 8px; margin-bottom: 24px; }
    input[type="text"] { flex: 1; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 10px 16px; font-size: 16px; border: none; border-radius: 4px; background: #2563eb; color: #fff; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; justify-content: space-between; padding: 10px; border: 1px solid #eee; border-radius: 4px; margin-bottom: 8px; }
    li.done span { text-decoration: line-through; color: #999; }
    li button { background: #dc2626; }
  </style>
</head>
<body>
  <h1>Lista de Tarefas</h1>
  <form id="task-form">
    <input type="text" id="task-input" placeholder="Nova tarefa..." required />
    <button type="submit">Adicionar</button>
  </form>
  <ul id="task-list"></ul>

  <script>
    const form = document.getElementById('task-form');
    const input = document.getElementById('task-input');
    const list = document.getElementById('task-list');

    async function loadTasks() {
      try {
        const res = await fetch('/tasks');
        if (!res.ok) throw new Error('Falha na resposta do servidor.');
        const tasks = await res.json();
        list.innerHTML = '';
        tasks.forEach((task) => {
          const li = document.createElement('li');
          li.className = task.done ? 'done' : '';
          const span = document.createElement('span');
          span.textContent = task.title;
          const toggleBtn = document.createElement('button');
          toggleBtn.textContent = task.done ? 'Desfazer' : 'Concluir';
          toggleBtn.onclick = () => toggleTask(task.id);
          const deleteBtn = document.createElement('button');
          deleteBtn.textContent = 'Excluir';
          deleteBtn.onclick = () => deleteTask(task.id);
          const actions = document.createElement('div');
          actions.append(toggleBtn, deleteBtn);
          li.append(span, actions);
          list.append(li);
        });
      } catch (err) {
        list.innerHTML = '<li style="color:#dc2626">Nao foi possivel carregar as tarefas. Verifique se o servidor esta no ar.</li>';
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = input.value.trim();
      if (!title) return;
      const res = await fetch('/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title }),
      });
      if (!res.ok) {
        const data = await res.json();
        list.innerHTML = `<li style="color:#dc2626">${data.error || 'Erro ao adicionar tarefa.'}</li>`;
        return;
      }
      input.value = '';
      loadTasks();
    });

    async function toggleTask(id) {
      await fetch(`/tasks/${id}`, { method: 'PATCH' });
      loadTasks();
    }

    async function deleteTask(id) {
      await fetch(`/tasks/${id}`, { method: 'DELETE' });
      loadTasks();
    }

    loadTasks();
  </script>
</body>
</html>
